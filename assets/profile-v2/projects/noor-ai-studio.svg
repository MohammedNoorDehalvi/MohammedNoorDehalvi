<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-labelledby="title desc">
<title id="title">NOOR AI STUDIO</title><desc id="desc">Open-source multi-agent AI development workspace</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
 <linearGradient id="g" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#a78bfa" stop-opacity=".68"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 .orb{animation:drift 5s ease-in-out infinite alternate}.scan{animation:scan 3.8s linear infinite}.pulse{animation:p 2s ease-in-out infinite}.node{animation:n 3s ease-in-out infinite alternate}
 @keyframes drift{to{transform:translate(-32px,18px) scale(1.12)}}@keyframes scan{from{transform:translateX(-620px)}to{transform:translateX(620px)}}@keyframes p{50%{opacity:.32}}@keyframes n{to{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="3" y="3" width="554" height="184" rx="22" fill="url(#bg)" stroke="url(#g)" stroke-width="2"/>
<circle class="orb" cx="520" cy="5" r="125" fill="url(#orb)" opacity=".45"/>
<path class="scan" d="M-100 7l90 176h32L-68 7z" fill="url(#g)" opacity=".06"/>
<g class="node" fill="none" stroke="#22d3ee" stroke-opacity=".28">
 <path d="M455 52l28-18 30 18v34l-30 18-28-18z"/>
 <path d="M483 34v70M455 52l58 34M513 52l-58 34"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="28" y="34" fill="#64748b" font-size="11" font-weight="800" letter-spacing="2">PROJECT // 10</text>
 <text x="28" y="76" fill="#f8fafc" font-size="24" font-weight="900">NOOR AI STUDIO</text>
 <text x="28" y="104" fill="#94a3b8" font-size="13">Open-source multi-agent AI development workspace</text>
 <rect x="28" y="126" width="365" height="34" rx="11" fill="#020617" fill-opacity=".66" stroke="#263449"/>
 <text x="44" y="148" fill="#cbd5e1" font-size="11" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">OPEN SOURCE  •  ELECTRON  •  MULTI-AGENT</text>
 <rect x="414" y="126" width="117" height="34" rx="17" fill="#020617" fill-opacity=".8" stroke="#a78bfa"/>
 <circle class="pulse" cx="433" cy="143" r="5" fill="#34d399" filter="url(#glow)"/>
 <text x="449" y="147" fill="#f8fafc" font-size="11" font-weight="900" letter-spacing="1">IN BUILD</text>
 <text x="526" y="42" fill="#a78bfa" font-size="26" font-weight="900" text-anchor="end">↗</text>
</g>
</svg>